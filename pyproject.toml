[project]
name = "notice"
version = "0.1.0"
description = "Notice: attention as an API (eye tracking + voice for AI agents)"
readme = "README.md"
authors = [
    { name = "Akshit Bansal", email = "akshitbansal1313@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "numpy>=2.4.6",
    "pupil-labs-realtime-api>=1.9.0",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "pyobjc-framework-webkit>=12.2.2",
    "real-time-screen-gaze>=1.1.2",
    "sounddevice>=0.5.6",
    "websockets>=17.2",
]

[project.scripts]
notice = "notice.daemon:main"
notice-mcp = "notice.mcp_server:main"
notice-voice = "notice.voice:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
